# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  apt_packages:
    - graphviz
    - plantuml
    - wget
  jobs:
    pre_build:
      - add-apt-repository -y ppa:ondrej/php
      - apt-get update
      - apt-get install -y php8.5-cli php8.5-mbstring php8.5-xml composer
      - php -v
      - composer install --prefer-dist --no-interaction --no-progress
      - wget https://github.com/phpDocumentor/phpDocumentor/releases/download/v3.10.0/phpDocumentor.phar -O /tmp/phpDocumentor.phar
      - php /tmp/phpDocumentor.phar

sphinx:
  configuration: docs/conf.py

formats:
  - htmlzip

python:
  install:
    - requirements: docs/requirements.txt

